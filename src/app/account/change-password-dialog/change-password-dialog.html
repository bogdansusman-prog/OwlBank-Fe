<div class="password-dialog">

  <div class="dialog-header">

    <div class="dialog-icon">
      <mat-icon>lock_reset</mat-icon>
    </div>

    <div>
      <h2>
        Change Password
      </h2>

      <p>
        Enter your current password
        and choose a new password.
      </p>
    </div>


    <button
      type="button"
      class="close-button"
      aria-label="Close"
      (click)="close()"
    >
      <mat-icon>
        close
      </mat-icon>
    </button>

  </div>


  <div class="form-group">

    <label>
      Current Password
    </label>

    <input
      type="password"
      [(ngModel)]="currentPassword"
      placeholder="Enter current password"
      autocomplete="current-password"
    >

  </div>


  <div class="form-group">

    <label>
      New Password
    </label>

    <input
      type="password"
      [(ngModel)]="newPassword"
      placeholder="Enter new password"
      autocomplete="new-password"
    >

  </div>


  <div class="form-group">

    <label>
      Confirm New Password
    </label>

    <input
      type="password"
      [(ngModel)]="confirmPassword"
      placeholder="Enter new password again"
      autocomplete="new-password"
    >

  </div>


  @if (errorMessage) {

    <div class="password-error">

      <mat-icon>
        error_outline
      </mat-icon>

      <span>
        {{ errorMessage }}
      </span>

    </div>

  }


  @if (successMessage) {

    <div class="password-success">

      <mat-icon>
        check_circle
      </mat-icon>

      <span>
        {{ successMessage }}
      </span>

    </div>

  }


  <div class="dialog-actions">

    <button
      type="button"
      class="cancel-button"
      [disabled]="isLoading"
      (click)="close()"
    >
      Cancel
    </button>


    <button
      type="button"
      class="save-password-button"
      [disabled]="isLoading"
      (click)="changePassword()"
    >

      @if (isLoading) {

        <mat-icon class="loading-icon">
          sync
        </mat-icon>

        <span>
          Changing...
        </span>

      } @else {

        <mat-icon>
          lock_reset
        </mat-icon>

        <span>
          Change Password
        </span>

      }

    </button>

  </div>

</div>
